<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>House Builder – clean v1</title>
<style>
  body{
    margin:0;
    background:#0b0f14;
    color:#e6edf3;
    font-family:system-ui, sans-serif;
    display:flex;
    height:100vh;
  }
  #panel{
    width:240px;
    background:#121821;
    border-right:1px solid #1e293b;
    padding:12px;
    box-sizing:border-box;
  }
  canvas{
    flex:1;
    background:#0e141c;
  }
  input, button{
    width:100%;
    margin-bottom:8px;
    background:#0e141c;
    color:#e6edf3;
    border:1px solid #2b3644;
    padding:6px;
    box-sizing:border-box;
  }
  button{cursor:pointer}
  .locked{opacity:.4}
</style>
</head>
<body>

<div id="panel">
  <b>User</b>
  <input id="userInput" placeholder="username" />
  <b>Token</b>
  <input id="tokenInput" type="password" placeholder="token" />
  <button id="loginBtn">Enter</button>

  <div id="afterLogin" style="display:none">
    <hr style="border:0;border-top:1px solid #2b3644;margin:8px 0" />
    <div id="pointsDisplay"><b>Points:</b> 0</div>

    <hr style="border:0;border-top:1px solid #2b3644;margin:8px 0" />
    <b>Rooms</b>
    <button class="locked">Bathroom 🔒</button>
    <button class="locked">Kitchen 🔒</button>
    <button class="locked">Extra Room 🔒</button>

    <hr style="border:0;border-top:1px solid #2b3644;margin:8px 0" />
    <b>Unlock Code</b>
    <input id="codeInput" placeholder="BATHROOM-XXXX" />
    <button id="applyCode">Apply</button>
  </div>
</div>

<canvas id="map"></canvas>

<script>
// ===== CONFIG =====
const TILE = 32;
const POINTS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRrPm6oe4q_rk9mOeEotMu-XfY8L6M0w1SWq3YEtFSfp4si8xxBud25WF1bect9f7-ormzp7POypcQx/pub?output=csv';

// ===== CANVAS =====
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = window.innerWidth - 240;
  canvas.height = window.innerHeight;
  draw();
}
window.addEventListener('resize', resize);
resize();

// ===== STATE =====
let loggedIn = false;
let points = 0;

const house = {
  rooms: [],
  door: {x:0,y:0}
};

function initHouse(){
  house.rooms = [{ x:4, y:4, w:6, h:8 }];
  house.door = { x:6, y:4 };
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!loggedIn) return;

  house.rooms.forEach(r=>{
    ctx.fillStyle = '#374151';
    ctx.fillRect(r.x*TILE,r.y*TILE,r.w*TILE,r.h*TILE);
    ctx.strokeStyle = '#9ca3af';
    ctx.strokeRect(r.x*TILE,r.y*TILE,r.w*TILE,r.h*TILE);
  });

  ctx.fillStyle = '#22c55e';
  ctx.fillRect(house.door.x*TILE, house.door.y*TILE, TILE, TILE/2);
}

// ===== LOGIN =====
document.getElementById('loginBtn').onclick = async ()=>{
  const user = userInput.value.trim();
  const token = tokenInput.value.trim();
  if(!user || !token) return;

  try{
    const res = await fetch(POINTS_CSV_URL);
    const text = await res.text();

    const lines = text.split('\n');
    const header = lines.shift().replace('\r','').split(',').map(h=>h.toLowerCase());
    const uIdx = header.indexOf('username');
    const tIdx = header.indexOf('token');
    const pIdx = header.indexOf('points');

    for(const line of lines){
      const row = line.replace('\r','').split(',');
      if(row[uIdx] === user && row[tIdx] === token){
        points = Number(row[pIdx]) || 0;
        pointsDisplay.innerHTML = '<b>Points:</b> ' + points;
        loggedIn = true;
        afterLogin.style.display = 'block';
        initHouse();
        draw();
        return;
      }
    }
  }catch(e){
    console.error(e);
  }
};
</script>
</body>
</html>
