<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sanity Test</title>
  <style>
    body { background:#111; color:#eee; font-family:sans-serif; padding:20px }
    input, button { display:block; margin:10px 0; padding:6px }
  </style>
</head>
<body>

<h2>Login Test</h2>

<input id="user" placeholder="username">
<input id="token" placeholder="token">
<button id="go">Enter</button>

<pre id="out">waiting…</pre>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRrPm6oe4q_rk9mOeEotMu-XfY8L6M0w1SWq3YEtFSfp4si8xxBud25WF1bect9f7-ormzp7POypcQx/pub?output=csv";

go.onclick = async () => {
  out.textContent = "clicked…";

  try {
    const res = await fetch(CSV_URL);
    const text = await res.text();

    const lines = text.trim().split("\n");
    const header = lines.shift().split(",").map(h => h.toLowerCase());

    const u = header.indexOf("username");
    const t = header.indexOf("token");
    const p = header.indexOf("points");

    for (const line of lines) {
      const row = line.split(",");
      if (row[u] === user.value && row[t] === token.value) {
        out.textContent =
          "MATCHED\nusername: " + row[u] +
          "\npoints: " + row[p];
        return;
      }
    }

    out.textContent = "no match";

  } catch (e) {
    out.textContent = "ERROR:\n" + e;
  }
};
</script>

</body>
</html>
