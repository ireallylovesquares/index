<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Baseline</title>
  <style>
    body{
      background:#111;
      color:#eee;
      font-family:system-ui,sans-serif;
      padding:24px;
    }
    input,button{
      display:block;
      margin:10px 0;
      padding:8px;
      width:260px;
    }
    pre{
      background:#000;
      padding:12px;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>

<h2>Login Test (Baseline)</h2>

<select id="savedLogins" style="width:260px;margin:10px 0"></select>
<input id="user" placeholder="username" />
<input id="token" placeholder="token" />
<button id="go" type="button">Enter</button>

<pre id="out">js alive</pre>

<script>
(() => {
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRrPm6oe4q_rk9mOeEotMu-XfY8L6M0w1SWq3YEtFSfp4si8xxBud25WF1bect9f7-ormzp7POypcQx/pub?output=csv";

  const userEl = document.getElementById('user');
  const tokenEl = document.getElementById('token');
  const outEl = document.getElementById('out');
  const savedSelect = document.getElementById('savedLogins');

  let saved = JSON.parse(localStorage.getItem('savedLogins') || '[]');

  function refreshSelect(){
    savedSelect.innerHTML = '<option value="">-- select saved login --</option>';
    saved.forEach((s,i)=>{
      const opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = s.username;
      savedSelect.appendChild(opt);
    });
  }

  savedSelect.addEventListener('change', ()=>{
    const idx = savedSelect.value;
    if(idx === '') return;
    const s = saved[Number(idx)];
    if(!s) return;
    userEl.value = s.username;
    tokenEl.value = s.token;
  });

  refreshSelect();

  document.getElementById('go').addEventListener('click', async () => {
    const username = userEl.value.trim();
    const token = tokenEl.value.trim();
    if(!username || !token) return;

    outEl.textContent = 'checking...';

    try {
      const res = await fetch(CSV_URL, { cache: 'no-store' });
      const text = await res.text();

      const lines = text.trim().split(/
?
/);
      const header = lines.shift().split(',').map(h => h.trim().toLowerCase());

      const u = header.indexOf('username');
      const t = header.indexOf('token');
      const p = header.indexOf('points');

      for (const line of lines) {
        const row = line.split(',').map(v => v.trim());
        if (row[u] === username && row[t] === token) {
          if(!saved.find(s=>s.username===username && s.token===token)){
            saved.push({ username, token });
            localStorage.setItem('savedLogins', JSON.stringify(saved));
            refreshSelect();
          }

          outEl.textContent =
            'MATCHED
' +
            'username: ' + row[u] + '
' +
            'points: ' + row[p] + '

' +
            '---
' +
            'login used:
' +
            'name: ' + username + '
' +
            'token: ' + token;
          return;
        }
      }

      outEl.textContent = 'no match';

    } catch (e) {
      outEl.textContent = 'ERROR:
' + (e && e.message ? e.message : String(e));
    }
  });
})();
</script>

</body>
</html>
